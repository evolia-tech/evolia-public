<section class="hero">
  <div class="hero__bg">
    <div class="grid-pattern"></div>
    <div class="glow-effect glow-left"></div>
    <div class="glow-effect glow-right"></div>
  </div>

  <div class="container hero__container">
    <h1 class="hero__title">
      Construisons ensemble le <span class="text-gradient">site web</span> ou
      <span class="text-gradient">l'application mobile</span> qui propulse votre activité
    </h1>
    <p class="hero__description">
      Faites équipe avec nos experts pour transformer vos idées en réalité grâce à notre accompagnement
      sur-mesure
    </p>
    <div class="hero__actions">
      <app-evo-button text="Nos Réalisations" link="/portfolio" variant="solid" preset="green"></app-evo-button>
      <app-evo-button text="Lancer mon projet" variant="outline" preset="cream"
        (click)="quoteService.openQuoteForm()"></app-evo-button>
    </div>
  </div>
</section>
