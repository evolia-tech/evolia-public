<div class="page-portfolio">
  <div class="content container">
    <!-- En-tête de la page -->
    <app-portfolio-hero-banner></app-portfolio-hero-banner>

    <!-- Liste des projets -->
    <app-projects-list
      [projects]="projects()"
      (projectSelect)="openProjectModal($event)">
    </app-projects-list>
  </div>

  @if (pendingProject()) {
  <app-project-pending-modal
    [project]="pendingProject()!"
    (close)="closePendingModal()">
  </app-project-pending-modal>
  }
</div>
