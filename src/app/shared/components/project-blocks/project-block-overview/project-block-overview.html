<section id="overview">
  <h2 class="project-modal-title" [innerHTML]="displayTitle()" appGsapSplitTextFadeInScrollTrigger [isTextSplit]="true" [duration]="0.8" [delay]="0.1"></h2>
  <div class="project-modal-impact-statement">
    <p [innerHTML]="data().impactStatement" appGsapSplitTextFadeInScrollTrigger [isTextSplit]="false" [duration]="0.8" [delay]="0.35"></p>
  </div>
</section>
