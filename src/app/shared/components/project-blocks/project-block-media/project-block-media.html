<div class="project-media-block-wrapper">
  @for (item of items(); track $index) {
    <div
      class="intro-media"
      [class.media-card-with-caption]="!!item.caption"
      [class.media-mockup-variant]="item.variant === 'mockup'"
    >
      @if (item.variant === 'mockup') {
        <div class="mockup-glow-container">
          <div class="glow-backdrop"></div>
          <img
            [src]="item.src"
            [alt]="item.alt || ''"
            class="mockup-image"
            loading="lazy"
          />
        </div>
        @if (liveUrl()) {
          <div class="mockup-action-button">
            <app-evo-button
              text="Voir le site web"
              [link]="liveUrl()!"
              [isExternal]="true"
              preset="cream"
              variant="outline"
            />
          </div>
        }
      } @else {
        <div class="media-frame">
          @if (item.type === 'video') {
            <video
              [src]="item.src"
              autoplay
              loop
              muted
              playsinline
              class="standard-video"
            ></video>
          } @else {
            <img
              [src]="item.src"
              [alt]="item.alt || ''"
              class="standard-image"
              loading="lazy"
            />
          }
        </div>
      }
      @if (item.caption) {
        <div class="caption-container">
          <p class="media-caption">{{ item.caption }}</p>
        </div>
      }
    </div>
  }
</div>
