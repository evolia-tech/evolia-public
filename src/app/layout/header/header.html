<!-- On ajoute la classe .scrolled et .menu-open conditionnellement via les Signals -->
<header class="header" [class.scrolled]="isScrolled()" [class.menu-open]="isMenuOpen()">
  <div class="container header__container">

    <!-- GAUCHE : Logo + Nom -->
    <a routerLink="/" class="header__brand" (click)="closeMenu()">
      <!-- Le Symbole (Image) -->
      <img src="/images/logo-evolia-tech.png" alt="Évolia Tech Logo" class="header__logo-icon">

      <!-- Le Nom (Texte) -->
      <span class="header__logo-text">
        Évolia <span class="text-highlight">Tech</span>
      </span>
    </a>

    <!-- Toggle menu mobile -->
    <button class="header__toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()" aria-label="Ouvrir le menu">
      <fa-icon [icon]="isMenuOpen() ? faTimes : faBars"></fa-icon>
    </button>

    <nav class="header__nav">
      <ul>
        <li><a routerLink="/portfolio" routerLinkActive="active" (click)="closeMenu()">Nos Réalisations</a></li>
        <li><a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">À Propos</a></li>
        <li><a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a></li>
      </ul>
      
      <!-- Bouton d'action doublé pour la version mobile -->
      <div class="header__mobile-actions">
        <app-evo-button
          text="Devis Gratuit"
          preset="green"
          variant="solid"
          (click)="quoteService.openQuoteForm(); closeMenu()">
        </app-evo-button>
      </div>
    </nav>

    <!-- DROITE : Bouton Contact (Affiché sur desktop uniquement) -->
    <div class="header__actions">
      <!-- On utilise ton composant EvoButton -->
      <app-evo-button
        text="Devis Gratuit"
        preset="green"
        variant="solid"
        (click)="quoteService.openQuoteForm()">
      </app-evo-button>
    </div>

  </div>
</header>
