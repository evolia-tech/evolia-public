<section [id]="data().id || 'gallery'" class="project-modal-detail-section gallery-section">
  <h3 class="section-title">{{ data().title || 'Galerie & Visuels du Projet' }}</h3>
  @if (data().introText) {
    <p class="section-intro">{{ data().introText }}</p>
  }
  <div class="masonry-grid">
    @for (item of data().images; track $index) {
      <div class="masonry-item">
        <div class="image-card">
          <img [src]="item.src" [alt]="item.alt || ''" loading="lazy" />
          @if (item.caption) {
            <div class="item-overlay">
              <span class="item-caption">{{ item.caption }}</span>
            </div>
          }
        </div>
      </div>
    }
  </div>
</section>
