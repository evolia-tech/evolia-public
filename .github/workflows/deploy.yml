name: Deploy Evolia Tech to o2switch

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy via FTP to o2switch
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Angular SSG Application
        run: npm run build

      - name: 🚀 Upload Files to o2switch FTP
        uses: SamKirland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
          local-dir: './dist/evolia-tech-public/browser/'
          dangerous-clean-slate: false
